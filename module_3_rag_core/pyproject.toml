[project]
name = "module-3-rag-core"
version = "0.1.0"
description = "Core RAG API and Vectorization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "fastembed>=0.8.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn>=0.51.0",
    "einops>=0.8.2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "types-psutil>=7.2.2.20260518",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.11"
strict = true
exclude = [".venv"]
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
